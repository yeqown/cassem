name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Run go vet
        run: make vet

      - name: Run tests
        run: make test

      - name: Build binaries
        run: go build -v ./...

  integration:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 30
    env:
      CONTAINER_TOOL: docker
      CASSEM_INTEGRATION_STRICT: "1"
      IMAGE_TAG: integration-${{ github.sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Verify Docker Compose
        run: docker compose version

      - name: Run integration release gate
        run: make test.integration.cluster
