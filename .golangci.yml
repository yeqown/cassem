version: "2"

run:
  timeout: 5m
  relative-path-mode: gomod
  tests: true

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - revive
    - gocritic
    - unconvert
    - unparam
    - misspell
    - gocyclo
    - funlen
  settings:
    errcheck:
      check-type-assertions: true
      check-blank: false
    gocyclo:
      min-complexity: 20
    funlen:
      lines: 120
      statements: 70
    revive:
      severity: warning
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: exported
          disabled: true
        - name: increment-decrement
        - name: var-declaration
        - name: package-comments
          disabled: true
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: indent-error-flow
        - name: errorf
        - name: empty-block
        - name: superfluous-else
        - name: unused-parameter
          disabled: true
        - name: unreachable-code
  exclusions:
    generated: strict
    paths:
      - '(^|/)bin/'
      - '(^|/)dist/'
      - '(^|/)vendor/'
      - '(^|/)thirdparty/'
      - '(^|/)web/node_modules/'
      - '(^|/)web/dist/'
      - '(^|/)\.deploy/'
      - '(^|/)\.git/'
      - '(^|/)\.codegraph/'
      - '.*\.pb\.go$'
      - '.*\.pb\.validate\.go$'
    rules:
      - path: '(.+)_test\.go$'
        linters:
          - errcheck
          - funlen
          - gocyclo
          - unparam
      - path: '(.+)_test\.go$'
        text: 'fieldalignment:'

formatters:
  exclusions:
    generated: strict
    paths:
      - '(^|/)bin/'
      - '(^|/)dist/'
      - '(^|/)vendor/'
      - '(^|/)thirdparty/'
      - '(^|/)web/node_modules/'
      - '(^|/)web/dist/'
      - '(^|/)\.deploy/'
      - '(^|/)\.git/'
      - '(^|/)\.codegraph/'
      - '.*\.pb\.go$'
      - '.*\.pb\.validate\.go$'
