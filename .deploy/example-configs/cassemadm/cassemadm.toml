debug = false
cassemkv = [
    "cassemkv1:2021",
    "cassemkv2:2021",
    "cassemkv3:2021"
]

[http]
    addr = ":20218"

[auth]
    sessionSecret = "dev-only-change-me-session-secret"
    bootstrapAccount = "superadmin@example.com"
    bootstrapPassword = "cassem"
    bootstrapNickname = "superadmin"

[retention]
    enabled = true
    interval = "10m"
    maxElementsPerRun = 20
    elementPageSize = 100
    keepVersionCount = 20
    keepVersionDays = 30
    keepOperationDays = 180
    failureResultTTL = "48h"